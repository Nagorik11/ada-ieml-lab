name: Validate ADA IEML Lab
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check HTML entrypoint and module mount
        run: |
          test -s index.html
          grep -q 'src/ieml/ui.js' index.html
          grep -q 'id="alphabetBody"' index.html
          grep -q 'id="iemlDocsResults"' index.html
          grep -q 'id="canonicalPanel"' index.html
          grep -q 'src/ieml/canonical-ui.js' index.html
          grep -q 'id="upstreamPanel"' index.html
          grep -q 'src/ieml/upstream-ui.js' index.html
          grep -q 'id="databasePanel"' index.html
          grep -q 'src/ieml/database-ui.js' index.html
          grep -q 'id="latticePanel"' index.html
          grep -q 'src/ieml/lattice-ui.js' index.html
          grep -q 'id="grammarPanel"' index.html
          grep -q 'src/ieml/grammar-ui.js' index.html
      - name: Check all inline JavaScript blocks
        run: |
          node --input-type=commonjs - <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html','utf8');
          const scripts = [...html.matchAll(/<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/g)];
          if(!scripts.length)throw Error('No inline scripts');
          for(const [i,m] of scripts.entries())new vm.Script(m[1],{filename:'index.html:'+i});
          console.log('Validated '+scripts.length+' inline scripts');
          NODE
      - name: Check IEML modules
        run: npm run check
      - name: Run IEML JS unit tests
        run: npm test
      - name: Compile all Python backend modules
        run: python -m compileall -q backend
      - name: Run Python reference, alignment, canonical and database tests
        run: python -m unittest backend.test_reference backend.test_ieml_bridge backend.test_canonical_space backend.test_upstream_ieml backend.test_upstream_database backend.test_lattice backend.test_script_inspector backend.test_upstream_sources backend.test_operator_bridge -v
